<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Recruitment Exam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f5f7; color: #1f2937; padding: 2rem; }
        .dashboard-container { max-width: 1000px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { color: #111827; }
        .refresh-btn { background: #2563eb; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .refresh-btn:hover { background: #1d4ed8; }
        
        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 1rem 1.5rem; border-bottom: 1px solid #e5e7eb; }
        th { background-color: #f9fafb; font-weight: 600; color: #4b5563; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #f9fafb; }
        
        .score-badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-weight: 600; font-size: 0.875rem; }
        .score-high { background-color: #d1fae5; color: #065f46; }
        .score-med { background-color: #fef3c7; color: #92400e; }
        .score-low { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <div>
                <h1>Admin Dashboard</h1>
                <p>Candidate Examination Results</p>
            </div>
            <button class="refresh-btn" onclick="fetchResults()">Refresh Data</button>
        </header>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Name</th>
                        <th>Roll No</th>
                        <th>Section</th>
                        <th>Role</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <tr><td colspan="6" style="text-align: center;">Loading results...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchResults() {
            try {
                const response = await fetch('/api/results');
                const data = await response.json();
                const tbody = document.getElementById('results-body');
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No submissions yet.</td></tr>';
                    return;
                }

                // Sort by timestamp descending
                data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                tbody.innerHTML = '';
                data.forEach(item => {
                    const date = new Date(item.timestamp).toLocaleString();
                    let badgeClass = 'score-low';
                    if (item.percentage >= 70) badgeClass = 'score-high';
                    else if (item.percentage >= 50) badgeClass = 'score-med';

                    tbody.innerHTML += `
                        <tr>
                            <td style="color: #6b7280; font-size: 0.9rem;">${date}</td>
                            <td style="font-weight: 600;">${item.name}</td>
                            <td>${item.roll}</td>
                            <td>${item.section}</td>
                            <td>${item.role}</td>
                            <td>
                                <span class="score-badge ${badgeClass}">${item.score} / 50 (${item.percentage}%)</span>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Error fetching results:', err);
                document.getElementById('results-body').innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">Failed to load data.</td></tr>';
            }
        }

        // Fetch on load
        fetchResults();
    </script>
</body>
</html>
